<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Changed to flex-start to allow high scores below */
            min-height: 100vh;
            margin: 0;
            background-color: #333;
            color: #eee;
            font-family: 'Press Start 2P', cursive, monospace; /* Pixel font if available, fallback to monospace */
            flex-direction: column;
            padding-top: 20px;
        }

        @font-face {
            font-family: 'Press Start 2P';
            src: url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
            /* Fallback or local install would be better for production */
        }

        #game-wrapper {
            display: flex;
            flex-direction: row; /* Arrange game and high scores horizontally */
            gap: 40px;
            align-items: flex-start;
            margin-bottom: 40px;
        }

        #game-container {
            border: 5px solid #0f0;
            background-color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.7);
        }

        canvas {
            background-color: #000;
            display: block;
        }

        #game-info {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 10px;
            font-size: 1.2em;
            color: #0f0;
        }

        #score {
            text-align: left;
            flex-grow: 1;
        }

        button {
            background-color: #0a0;
            color: #fff;
            border: 2px solid #0f0;
            padding: 8px 15px;
            font-size: 1em;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s, border-color 0.2s;
            font-family: 'Press Start 2P', monospace;
            margin-left: 10px;
        }

        button:hover {
            background-color: #0f0;
            color: #000;
            border-color: #fff;
        }

        #game-over {
            position: absolute; /* Position over the canvas */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgba(0, 0, 0, 0.9);
            color: #f00;
            font-size: 1.5em;
            text-align: center;
            width: calc(100% - 20px); /* Adjust to fit inside container padding */
            height: calc(100% - 20px);
            left: 10px;
            top: 10px;
            border: 2px solid #f00;
            box-sizing: border-box; /* Include padding and border in the element's total width and height */
        }

        #game-over h2 {
            margin-bottom: 10px;
            color: #f00;
            font-size: 1.8em;
        }

        #game-over p {
            margin: 5px 0;
            font-size: 1.2em;
        }

        #playerName {
            padding: 8px;
            margin: 15px 0;
            font-size: 1em;
            border: 2px solid #0f0;
            background-color: #222;
            color: #eee;
            text-align: center;
            font-family: 'Press Start 2P', monospace;
            width: 80%;
            max-width: 200px;
        }

        #high-scores {
            border: 5px solid #0f0;
            background-color: #000;
            padding: 10px;
            min-width: 250px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.7);
        }

        #high-scores h3 {
            color: #0f0;
            text-align: center;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        #highScoresList {
            list-style-type: none;
            padding: 0;
            margin: 0;
            color: #eee;
            font-size: 1em;
        }

        #highScoresList li {
            padding: 5px 0;
            border-bottom: 1px dotted #555;
            display: flex;
            justify-content: space-between;
        }

        #highScoresList li:last-child {
            border-bottom: none;
        }

        /* Responsive adjustments */
        @media (max-width: 800px) {
            #game-wrapper {
                flex-direction: column;
                align-items: center;
                gap: 20px;
            }

            canvas {
                width: 300px; /* Smaller canvas for small screens */
                height: 300px;
            }

            #game-container {
                width: 320px; /* Adjust container size */
            }

            #game-over {
                width: calc(100% - 20px);
                height: calc(100% - 20px);
                font-size: 1.2em;
            }

            #game-over h2 {
                font-size: 1.5em;
            }

            #playerName {
                width: 70%;
            }

            button {
                padding: 6px 10px;
                font-size: 0.9em;
            }

            #high-scores {
                min-width: unset;
                width: 320px; /* Match game container width */
            }
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container" style="position: relative;">
            <canvas id="gameCanvas"></canvas>
            <div id="game-info">
                <div id="score">Score: 0</div>
                <button id="startButton">Start Game</button>
            </div>
            <div id="game-over" style="display: none;">
                <h2>Game Over!</h2>
                <p id="final-score"></p>
                <input type="text" id="playerName" placeholder="Your Name" maxlength="10">
                <button id="submitScoreButton">Submit Score</button>
                <button id="restartButton">Play Again</button>
            </div>
        </div>
        <div id="high-scores">
            <h3>High Scores</h3>
            <ul id="highScoresList">
                <li>Loading...</li>
            </ul>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreDisplay = document.getElementById('score');
        const startButton = document.getElementById('startButton');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const playerNameInput = document.getElementById('playerName');
        const submitScoreButton = document.getElementById('submitScoreButton');
        const restartButton = document.getElementById('restartButton');
        const highScoresList = document.getElementById('highScoresList');

        const BACKEND_URL = 'http://127.0.0.1:8000'; // FastAPI backend URL

        const TILE_SIZE = 20;
        let CANVAS_WIDTH = 400; // Default size
        let CANVAS_HEIGHT = 400; // Default size
        let numTilesX;
        let numTilesY;

        let snake;
        let food;
        let score;
        let direction;
        let gameInterval;
        let gameRunning;
        let isGameOver;
        let baseGameSpeed = 150; // Milliseconds per frame
        let currentGameSpeed;
        let difficultyIncrement = 10; // Decrease interval by this much for every food eaten

        function setCanvasSize() {
            const containerWidth = document.getElementById('game-container').offsetWidth;
            CANVAS_WIDTH = Math.min(400, Math.floor((containerWidth - 20) / TILE_SIZE) * TILE_SIZE); // Keep it within container, multiple of TILE_SIZE
            CANVAS_HEIGHT = CANVAS_WIDTH; // Square canvas

            canvas.width = CANVAS_WIDTH;
            canvas.height = CANVAS_HEIGHT;

            numTilesX = CANVAS_WIDTH / TILE_SIZE;
            numTilesY = CANVAS_HEIGHT / TILE_SIZE;

            // Redraw if game is running or not over (to adjust food/snake positions potentially)
            if (gameRunning || !isGameOver) {
                drawGame();
            }
        }

        function initGame() {
            snake = [{ x: 10, y: 10 }];
            score = 0;
            direction = 'right';
            gameRunning = false;
            isGameOver = false;
            currentGameSpeed = baseGameSpeed;

            scoreDisplay.textContent = `Score: ${score}`;
            gameOverScreen.style.display = 'none';
            playerNameInput.value = '';
            startButton.style.display = 'block';
            restartButton.style.display = 'none';
            submitScoreButton.style.display = 'none';
            playerNameInput.style.display = 'none';

            generateFood();
            drawGame();
            fetchHighScores();
        }

        function startGame() {
            gameRunning = true;
            startButton.style.display = 'none';
            gameInterval = setInterval(mainLoop, currentGameSpeed);
        }

        function mainLoop() {
            if (!gameRunning) return;

            moveSnake();
            if (checkCollision()) {
                gameOver();
                return;
            }
            drawGame();
        }

        function drawGame() {
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT); // Clear canvas

            // Draw snake
            ctx.fillStyle = '#0f0';
            snake.forEach(segment => {
                ctx.fillRect(segment.x * TILE_SIZE, segment.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            });

            // Draw food
            ctx.fillStyle = '#f00';
            ctx.fillRect(food.x * TILE_SIZE, food.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
        }

        function moveSnake() {
            const head = { x: snake[0].x, y: snake[0].y };

            switch (direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }

            snake.unshift(head); // Add new head

            // Check if food is eaten
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreDisplay.textContent = `Score: ${score}`;
                generateFood();

                // Increase difficulty
                currentGameSpeed = Math.max(50, currentGameSpeed - difficultyIncrement); // Minimum speed of 50ms
                clearInterval(gameInterval);
                gameInterval = setInterval(mainLoop, currentGameSpeed);
            } else {
                snake.pop(); // Remove tail if no food eaten
            }
        }

        function checkCollision() {
            const head = snake[0];

            // Wall collision
            if (head.x < 0 || head.x >= numTilesX || head.y < 0 || head.y >= numTilesY) {
                return true;
            }

            // Self collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    return true;
                }
            }
            return false;
        }

        function generateFood() {
            let newFoodPos;
            while (true) {
                newFoodPos = {
                    x: Math.floor(Math.random() * numTilesX),
                    y: Math.floor(Math.random() * numTilesY)
                };

                // Ensure food does not spawn on snake
                let collisionWithSnake = false;
                for (let i = 0; i < snake.length; i++) {
                    if (newFoodPos.x === snake[i].x && newFoodPos.y === snake[i].y) {
                        collisionWithSnake = true;
                        break;
                    }
                }
                if (!collisionWithSnake) {
                    break;
                }
            }
            food = newFoodPos;
        }

        function gameOver() {
            gameRunning = false;
            isGameOver = true;
            clearInterval(gameInterval);
            gameOverScreen.style.display = 'flex';
            finalScoreDisplay.textContent = `You scored: ${score}`;
            playerNameInput.style.display = 'block';
            submitScoreButton.style.display = 'block';
            restartButton.style.display = 'block';
        }

        function changeDirection(event) {
            if (!gameRunning) return;

            const keyPressed = event.key;
            const newDirection = {
                'ArrowUp': 'up', 'w': 'up',
                'ArrowDown': 'down', 's': 'down',
                'ArrowLeft': 'left', 'a': 'left',
                'ArrowRight': 'right', 'd': 'right'
            }[keyPressed];

            // Prevent reversing direction
            const isOpposite = (direction === 'up' && newDirection === 'down') ||
                               (direction === 'down' && newDirection === 'up') ||
                               (direction === 'left' && newDirection === 'right') ||
                               (direction === 'right' && newDirection === 'left');

            if (newDirection && !isOpposite) {
                direction = newDirection;
            }
        }

        async function submitScore() {
            const playerName = playerNameInput.value.trim();
            if (!playerName) {
                alert('Please enter your name!');
                return;
            }

            try {
                const response = await fetch(`${BACKEND_URL}/scores`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name: playerName, score: score }),
                });
                if (response.ok) {
                    alert('Score submitted successfully!');
                    submitScoreButton.disabled = true; // Prevent multiple submissions
                    playerNameInput.disabled = true;
                    fetchHighScores(); // Refresh high scores
                } else {
                    alert('Failed to submit score.');
                }
            } catch (error) {
                console.error('Error submitting score:', error);
                alert('Error submitting score. Please check the backend connection.');
            }
        }

        async function fetchHighScores() {
            try {
                const response = await fetch(`${BACKEND_URL}/scores`);
                if (response.ok) {
                    const scores = await response.json();
                    highScoresList.innerHTML = '';
                    if (scores.length === 0) {
                        highScoresList.innerHTML = '<li>No high scores yet.</li>';
                    } else {
                        scores.forEach((s, index) => {
                            const li = document.createElement('li');
                            li.innerHTML = `<span>${index + 1}. ${s.name}</span><span>${s.score}</span>`;
                            highScoresList.appendChild(li);
                        });
                    }
                } else {
                    highScoresList.innerHTML = '<li>Failed to load high scores.</li>';
                }
            } catch (error) {
                console.error('Error fetching high scores:', error);
                highScoresList.innerHTML = '<li>Error loading high scores (backend unreachable?).</li>';
            }
        }

        // Event Listeners
        document.addEventListener('keydown', changeDirection);
        startButton.addEventListener('click', startGame);
        restartButton.addEventListener('click', () => {
            initGame();
            startGame();
        });
        submitScoreButton.addEventListener('click', submitScore);
        window.addEventListener('resize', setCanvasSize);

        // Initial setup
        setCanvasSize();
        initGame();
    </script>
</body>
</html>
